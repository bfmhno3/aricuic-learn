[project]
name = "aricuic-reproduction"
version = "0.1.0"
description = "CPU NumPy reproduction of rotation-invariant convolution algorithms for learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aricuic"]
