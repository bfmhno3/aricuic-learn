[project]
name = "aricuic-reproduction"
version = "0.1.0"
description = "CPU NumPy reproduction of rotation-invariant convolution algorithms for learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aricuic"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (导入排序)
    "B",   # flake8-bugbear (潜在 bug 检测)
    "UP",  # pyupgrade (自动升级旧式 Python 语法)
    "N",   # pep8-naming (命名规范)
    "SIM", # flake8-simplify (简化代码)
]
ignore = [
    "E501", # 忽略行超长警告（格式化会自动处理）
    "B008", # 允许在函数默认参数中使用函数调用
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
